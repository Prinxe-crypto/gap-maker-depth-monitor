name: Depth Monitor

on:
  repository_dispatch:
    types: [gap_maker_entry]
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Depth Monitor
        run: python depth_monitor.py

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Depth Monitor Bot"
          git add depth_snapshots.csv closed_depth_snapshots.csv last_seen_open.json last_seen_closed.json daily_depth_report.md || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Depth update [skip ci]" && git push)
