name: Depth Monitor

on:
  repository_dispatch:
    types: [gap_maker_entry]
  workflow_dispatch:

concurrency:
  group: depth-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Depth Monitor
        run: python depth_monitor.py

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Depth Monitor Bot"
          for f in depth_snapshots.csv closed_depth_snapshots.csv last_seen_open.json last_seen_closed.json daily_depth_report.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Depth update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
